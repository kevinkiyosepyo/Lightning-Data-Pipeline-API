[workspace]
resolver = "2"
members = [
    "crates/lightning-core",
    "crates/lightning-ingest",
    "crates/lightning-api",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kevinkiyosepyo/Lightning-Data-Pipeline-API"

[workspace.dependencies]
lightning-core = { path = "crates/lightning-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.14"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
