[package]
name = "lightning-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Blitzortung WebSocket ingestion → LZW decode → batched Postgres writes"

[dependencies]
lightning-core = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
